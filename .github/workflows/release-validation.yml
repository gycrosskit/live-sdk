name: Release validation
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable Maven or native-* Git Pod release tag
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CI_FORK_HOST_FALLBACK_IP: ${{ vars.CI_FORK_HOST_FALLBACK_IP }}
  JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=60000
  EMOJI_FLAGS: ${{ github.event_name != 'pull_request' && '-PverifyEmoji' || '' }}
  VERSION: ${{ github.event.release.tag_name || inputs.version }}
jobs:
  verify-public:
    if: ${{ !startsWith(github.event.release.tag_name || inputs.version, 'native-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
      CI_DIAGNOSTICS_DIR: ${{ github.workspace }}/ci-diagnostics
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Check exact frozen archive and public publications once
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        timeout-minutes: 30
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/verify-public.log -- bash scripts/verify-release.sh
      - if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        run: echo 'Public artifact validation runs for Release or an explicit version dispatch.'
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  release-android:
    if: ${{ always() && !startsWith(github.event.release.tag_name || inputs.version, 'native-') }}
    needs: verify-public
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require successful public verification
        run: |
          test "${{ needs.verify-public.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-android.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification/consumer "-PliveVersion=$VERSION" -PremoteOnly $EMOJI_FLAGS -PverifyKuiklyCompose assembleDebug verifyNoCmpUi verifySingleSdk --refresh-dependencies --no-daemon --max-workers=1 --stacktrace --info
        timeout-minutes: 35
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      # 新两产品合同同样验证真实远程 AAR 的 FRAME 与快照生命周期。
      - if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && (github.event_name != 'pull_request')
        timeout-minutes: 35
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-android.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification/consumer "-PliveVersion=$VERSION" -PremoteOnly $EMOJI_FLAGS -PverifyKuiklyCompose -PverifyFrame testDebugUnitTest --tests io.github.gycrosskit.livesdk.KuiklyLiveLayoutTest --tests io.github.gycrosskit.livesdk.KuiklyLiveLifecycleTest --no-daemon --max-workers=1 --stacktrace --info
      - name: Explain lightweight completion
        if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        run: echo 'No build is required for this event and scope.'
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  release-native:
    if: ${{ always() && !startsWith(github.event.release.tag_name || inputs.version, 'native-') }}
    needs: verify-public
    runs-on: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      LIVE_NATIVE_TAG: 'native-0.2.1-rc.15'
      LIVE_NATIVE_COMMIT: 'c9362a1df4c420fafd8f7b47865d34c598ccab1f'
    steps:
      - name: Require successful public verification
        run: |
          test "${{ needs.verify-public.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Identify Native toolchain and Xcode
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - name: Restore completed Kotlin Native toolchain
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        id: konan
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-native.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification/consumer "-PliveVersion=$VERSION" -PremoteOnly $EMOJI_FLAGS -PverifyKuiklyCompose compileKotlinIosArm64 compileKotlinIosSimulatorArm64 compileKotlinIosX64 --refresh-dependencies --no-daemon --max-workers=1 --stacktrace --info
        timeout-minutes: 45
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && (github.event_name != 'pull_request')
        timeout-minutes: 45
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-native.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification/consumer "-PliveVersion=$VERSION" -PremoteOnly -PverifyOhos -PverifyKuiklyCompose compileKotlinOhosArm64 --no-daemon --max-workers=1 --stacktrace --info
      - name: Build exact retained remote Native Renderer
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        timeout-minutes: 35
        run: |
          native_source="$RUNNER_TEMP/live-release-native"
          git clone --depth 1 --single-branch --branch "$LIVE_NATIVE_TAG" https://github.com/gycrosskit/live-sdk.git "$native_source"
          test "$(git -C "$native_source" rev-parse HEAD)" = "$LIVE_NATIVE_COMMIT"
          # 验证入口用当前候选；Native Swift 与 checker 的 ROOT/HEAD 仍绑定原生 tag。
          python3 - "$native_source" <<'PYTHON'
          import hashlib, json, os, shutil, subprocess, sys
          from pathlib import Path
          source, native = Path.cwd(), Path(sys.argv[1])
          runners = ('scripts/verify-live-renderer-ios.sh',
                     'verification/renderer-ios/Podfile', 'verification/renderer-ios/RendererTests.swift',
                     'verification/renderer-ios/test_contract.py')
          hashes = {}
          for name in runners:
              shutil.copyfile(source / name, native / name)
              hashes[name] = hashlib.sha256((native / name).read_bytes()).hexdigest()
              assert hashes[name] == hashlib.sha256((source / name).read_bytes()).hexdigest()
          subprocess.run(['git', '-C', str(native), 'diff', '--exit-code', 'HEAD', '--', 'ios/Sources'], check=True)
          candidate = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert candidate == os.environ['GITHUB_SHA']
          receipt = {'candidate_commit': candidate, 'runner_sha256': hashes,
                     'native_tag': os.environ['LIVE_NATIVE_TAG'], 'native_commit': os.environ['LIVE_NATIVE_COMMIT'],
                     'scope': 'Verification runner/Podfile/checker from candidate; production Swift unchanged from exact Native tag; installed Swift proof is emitted by the current checker inside the Native checkout.'}
          Path('ci-diagnostics/release-renderer-runner-proof.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYTHON
          (
            cd "$native_source"
            python3 "$GITHUB_WORKSPACE/scripts/ci-run.py" --no-progress-seconds 300 --log "$GITHUB_WORKSPACE/ci-diagnostics/release-native-renderer.log" -- bash scripts/verify-live-renderer-ios.sh
          )
          cp "$native_source/build/native-renderer-consumer/Podfile.lock" ci-diagnostics/release-renderer-Podfile.lock.txt
          cp "$native_source/build/native-renderer-consumer/native-source-proof.json" ci-diagnostics/release-renderer-source-proof.json
          printf 'LIVE_RENDERER_IOS_FRAMEWORK_DIR=%s/build/native-renderer-consumer/iphoneos\n' "$native_source" >> "$GITHUB_ENV"
          printf 'LIVE_KUIKLY_IOS_FRAMEWORK_DIR=%s/build/native-renderer-consumer/iphoneos\n' "$native_source" >> "$GITHUB_ENV"
      - name: Link new Maven with retained Native Renderer
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        timeout-minutes: 25
        run: |
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-maven-native-link.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification/consumer "-PliveVersion=$VERSION" -PremoteOnly $EMOJI_FLAGS -PverifyKuiklyCompose "-PkuiklyRenderFrameworkDir=$LIVE_KUIKLY_IOS_FRAMEWORK_DIR" linkDebugFrameworkIosArm64 --no-daemon --max-workers=1 --stacktrace --info
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-maven-native-link.log -- bash scripts/verify-ios-native.sh
      - name: Explain lightweight completion
        if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        run: echo 'No build is required for this event and scope.'
      - name: Cache only successful Native downloads
        if: success() && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  release-ohos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version == '0.3.0-rc.2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OHOS_CLT_URL: ${{ vars.OHOS_CLT_URL }}
      OHOS_CLT_SHA256: ${{ vars.OHOS_CLT_SHA256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: build/ohos-har/clt.zip
          key: ohos-clt-linux-${{ env.OHOS_CLT_SHA256 }}
      - name: Consume exact ohpm Registry HAR
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/ohpm-consumer.log -- bash scripts/verify-ohos-consumer.sh
      - uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        if: always()
        with:
          status: ${{ job.status }}
  release-pod:
    if: startsWith(github.event.release.tag_name || inputs.version, 'native-')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      LIVE_NATIVE_TAG: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.version }}
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Consume exact remote Native Core and Renderer Pods
        run: |
          export LIVE_NATIVE_COMMIT="$(git rev-parse HEAD)"
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native-pod-core.log -- bash scripts/verify-live-native-ios.sh
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native-pod-renderer.log -- bash scripts/verify-live-renderer-ios.sh
      - name: Preserve installed Pod locks and source proofs
        if: always()
        run: |
          mkdir -p ci-diagnostics
          for consumer in native-live-consumer native-renderer-consumer; do
            if [[ -f "build/$consumer/Podfile.lock" ]]; then
              cp "build/$consumer/Podfile.lock" "ci-diagnostics/$consumer-Podfile.lock.txt"
            fi
            if [[ -f "build/$consumer/native-source-proof.json" ]]; then
              cp "build/$consumer/native-source-proof.json" "ci-diagnostics/$consumer-source-proof.json"
            fi
          done
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
