name: Source regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      warm_native_cache:
        description: Warm Native toolchains on main only (leave version empty)
        type: boolean
        default: false
      har_only:
        description: Only HarmonyOS HAR and contracts (not full source acceptance)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI_FORK_HOST_FALLBACK_IP: ${{ vars.CI_FORK_HOST_FALLBACK_IP }}
  JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=60000
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.scope.outputs.source }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - id: scope
        run: python3 scripts/ci-changes.py
      - run: |
          mkdir -p ci-diagnostics
          printf 'event=%s\nsource=%s\n' "$GITHUB_EVENT_NAME" "${{ steps.scope.outputs.source }}" > ci-diagnostics/scope.txt
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  contracts:
    if: always()
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require successful scope detection
        run: test "${{ needs.changes.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: needs.changes.outputs.source == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: needs.changes.outputs.source == 'true'
      - name: Resolve ownership fixture compiler
        if: needs.changes.outputs.source == 'true'
        timeout-minutes: 8
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/contracts-resolve.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --init-script "$PWD/verification/ownership/fixture-dependencies.gradle" resolveOwnershipFixtureDependencies --no-daemon --max-workers=1
      - name: Verify Android login ownership
        if: needs.changes.outputs.source == 'true'
        timeout-minutes: 3
        run: python3 scripts/ci-run.py --no-progress-seconds 120 --log ci-diagnostics/contracts-account.log -- python3 verification/ownership/verify-android.py
      - timeout-minutes: 8
        if: needs.changes.outputs.source == 'true'
        run: |
          python3 verification/publication/test_maven_check.py
          python3 verification/publication/test_metadata.py
          python3 verification/ci/test_fork_host.py
          python3 verification/renderer-ios/test_contract.py
          python3 verification/ci/test_release_candidate.py
          python3 verification/ci/test_ohos_har.py
      - name: Explain lightweight completion
        if: ${{ !(needs.changes.outputs.source == 'true') }}
        run: echo 'No build is required for this event and scope.'
      - name: Check CI shell syntax
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/ci-python-cache" python3 -m py_compile scripts/ci-changes.py scripts/ci-run.py
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Check source cache and test execution policy
        if: needs.changes.outputs.source == 'true'
        run: python3 verification/ci/test_cache_contract.py
      - name: Install lightweight HarmonyOS fixture compiler
        if: needs.changes.outputs.source == 'true'
        run: npm install --prefix "$RUNNER_TEMP/live-typescript" --ignore-scripts --no-audit --no-fund typescript@4.9.5
      - name: Verify HarmonyOS SDK boundary behavior
        if: needs.changes.outputs.source == 'true'
        run: TYPESCRIPT_PATH="$RUNNER_TEMP/live-typescript/node_modules/typescript" node --test ohos/tests/*.test.cjs
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  android:
    if: github.event_name != 'workflow_dispatch' || !inputs.har_only
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GYC_CI_BUILD_CACHE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: needs.changes.outputs.source == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore source Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: needs.changes.outputs.source == 'true'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: needs.changes.outputs.source == 'true'
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/android.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" :live-core:testDebugUnitTest :live-kuikly:testDebugUnitTest :live-core:compileReleaseKotlinAndroid :live-kuikly:compileReleaseKotlinAndroid --no-daemon --max-workers=1 --stacktrace --info
        timeout-minutes: 35
        if: needs.changes.outputs.source == 'true'
      - name: Verify source Kuikly consumer and dependency isolation
        if: needs.changes.outputs.source == 'true'
        timeout-minutes: 20
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/consumer-android.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification/consumer -PverifyLocalSource -PliveVersion=0.3.0-rc.1 -PverifyKuiklyCompose assembleDebug verifyNoCmpUi verifySingleSdk --no-daemon --max-workers=1 --stacktrace --info
      - name: Explain lightweight completion
        if: ${{ !(needs.changes.outputs.source == 'true') }}
        run: echo 'No build is required for this event and scope.'
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  ohos-har:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OHOS_CLT_URL: ${{ vars.OHOS_CLT_URL }}
      OHOS_CLT_SHA256: ${{ vars.OHOS_CLT_SHA256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore official CLT archive
        id: clt-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/ohos-har/clt.zip
          key: ohos-clt-linux-${{ env.OHOS_CLT_SHA256 }}
      - name: Compile HarmonyOS HAR with official CLT
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/ohos-har.log -- bash scripts/build-ohos-har.sh
      - name: Cache verified official CLT archive
        if: always() && steps.clt-cache.outputs.cache-hit != 'true' && hashFiles('build/ohos-har/CLT_VERIFIED') != ''
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/ohos-har/clt.zip
          key: ohos-clt-linux-${{ env.OHOS_CLT_SHA256 }}
      - name: Keep compiled HAR and source identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ohos-har-${{ github.sha }}
          path: |
            build/ohos-har/GycLiveNative.har
            build/ohos-har/SOURCE_SHA
            build/ohos-har/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  native:
    if: github.event_name != 'workflow_dispatch' || !inputs.har_only
    needs: changes
    runs-on: ${{ ((needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')) && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      GYC_CI_BUILD_CACHE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Identify Native toolchain and Xcode
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - name: Restore completed Kotlin Native toolchain
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        id: konan
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore source Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: needs.changes.outputs.source == 'true'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native.log -- bash verification/ownership/verify-callbacks.sh
        timeout-minutes: 10
        if: needs.changes.outputs.source == 'true'
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native.log -- bash verification/picture-in-picture/verify.sh
        timeout-minutes: 10
        if: needs.changes.outputs.source == 'true'
      - name: Verify default Core Pod compatibility
        if: needs.changes.outputs.source == 'true'
        timeout-minutes: 20
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native-core-pod.log -- bash scripts/verify-live-native-ios.sh
      - name: Verify independent Renderer Pod and lifecycle
        if: needs.changes.outputs.source == 'true'
        timeout-minutes: 20
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/renderer.log -- bash scripts/verify-live-renderer-ios.sh
      - timeout-minutes: 45
        if: needs.changes.outputs.source == 'true'
        run: |
          ios_test_target=iosSimulatorArm64Test
          if [[ "$(uname -m)" != arm64 ]]; then ios_test_target=iosX64Test; fi
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" :live-core:"$ios_test_target" :live-core:compileKotlinIosArm64 :live-core:compileKotlinIosSimulatorArm64 :live-core:compileKotlinIosX64 :live-kuikly:compileKotlinIosArm64 :live-kuikly:compileKotlinIosSimulatorArm64 :live-kuikly:compileKotlinIosX64 :live-core:compileKotlinOhosArm64 --no-daemon --max-workers=1 --stacktrace --info
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/ohos-kotlin.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" :live-kuikly:compileKotlinOhosArm64 --no-daemon --max-workers=1 --stacktrace
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/ohos-consumer.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification/consumer -PverifyLocalSource -PverifyOhos -PverifyKuiklyCompose -PliveVersion=0.3.0-rc.1 compileKotlinOhosArm64 --no-daemon --max-workers=1 --stacktrace
          python3 -c 'import pathlib, sys, xml.etree.ElementTree as ET; files=pathlib.Path(".").glob("**/build/test-results/"+sys.argv[1]+"/*.xml"); cases=[case for path in files for case in ET.parse(path).iter("testcase")]; assert any(case.find("skipped") is None for case in cases), "No executed iOS test cases"' "$ios_test_target"
      - name: Link legacy LiveKuikly Swift adapter against candidate Renderer Pod
        if: needs.changes.outputs.source == 'true'
        timeout-minutes: 20
        run: |
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/renderer-kmp.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification/consumer -PverifyLocalSource -PliveVersion=0.3.0-rc.1 linkDebugFrameworkIosArm64 --no-daemon --max-workers=1 --stacktrace
          LIVE_RENDERER_IOS_FRAMEWORK_DIR="$PWD/build/native-renderer-consumer/iphoneos" LIVE_KUIKLY_IOS_FRAMEWORK_DIR="$PWD/build/native-renderer-consumer/iphoneos" python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/renderer-kmp.log -- bash scripts/verify-ios-native.sh
      - name: Explain lightweight completion
        if: ${{ !(needs.changes.outputs.source == 'true') }}
        run: echo 'No build is required for this event and scope.'
      - name: Warm trusted main Native cache
        if: (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main') && steps.konan.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native-warmup.log -- python3 scripts/ci-native-cache.py
      - name: Cache only successful Native downloads
        if: success() && ((needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')) && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
