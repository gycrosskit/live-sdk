name: Source regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: |
          python3 verification/publication/test_maven_check.py
          python3 verification/publication/test_metadata.py
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - run: bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" testDebugUnitTest :live-core:testDebugUnitTest :live-kuikly:testDebugUnitTest compileReleaseKotlinAndroid :live-kuikly:compileReleaseKotlinAndroid --no-daemon --max-workers=1 --stacktrace
  native:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - run: bash verification/ownership/verify-callbacks.sh
      - run: bash verification/picture-in-picture/verify.sh
      - run: bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" :live-core:iosSimulatorArm64Test compileKotlinIosArm64 compileKotlinIosSimulatorArm64 compileKotlinIosX64 :live-kuikly:compileKotlinIosArm64 :live-kuikly:compileKotlinIosSimulatorArm64 :live-kuikly:compileKotlinIosX64 --no-daemon --max-workers=1 --stacktrace
