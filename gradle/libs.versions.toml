[versions]
agp = "8.10.1"
kotlin = "2.2.21-1.0.0"
ktor = "3.3.3"
coroutines = "1.10.2-1.0.0"
lifecycle = "2.10.0"
activity = "1.13.0"
atomicx = "4.3.3.29"
tencentIm = "9.1.7818"
webkit = "1.16.0"
junit = "4.13.2"

[libraries]
ktor-http = { module = "io.ktor:ktor-http", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.10.2" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
atomicx-core = { module = "io.trtc.uikit:atomicx-core", version.ref = "atomicx" }
tencent-imsdk-plus = { module = "com.tencent.imsdk:imsdk-plus", version.ref = "tencentIm" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
